services:
  api: 
    build:
      context: .
      dockerfile: Dockerfile
    image: bapp/api
    ports:
      - '3000:3000'
    container_name: bapp-api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./src/:/app/src

  db:
    image: postgres:14.5
    restart: always
    ports:
      - '3555:5432'
    user: postgres
    container_name: bapp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bapp
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bapp"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

